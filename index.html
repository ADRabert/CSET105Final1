<html><head>
	<link href="assets/style.css" rel="stylesheet">
	<title>Grocery List Manager</title>
</head>
<body>

<h1>Grocery List</h1>
<div class="contentBox">
	<input type="text" id="groceryInput" placeholder="Enter your desired groceries: ">
	<button id="addItem">Add To List</button>
	<select id="displayOptions" name="displayOptions">
		<option value="allGroceries">Show All</option>
		<option value="purchased">Show Purchased</option>
		<option value="unpurchased">Show Unpurchased</option>
	</select>
</div>

</body>
</html>
