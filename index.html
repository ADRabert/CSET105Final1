<html><head>
	<link href="assets/style.css" rel="stylesheet">
	<title>Grocery List Manager</title>
</head>
<body>

<h1>Grocery List</h1>
<div class="contentBox">
	<input type="text" id="groceryInput" placeholder="Enter grocery item">
	<button id="addItem" onclick="addToList(document.getElementById(`groceryInput`).value)">Add To List</button>
	<select id="displayOptions" onchange="showItems(this.value)" name="displayOptions">
		<option value="allGroceries">Show All</option>
		<option value="purchased">Show Purchased</option>
		<option value="unpurchased">Show Unpurchased</option>
	</select>
	<ul id="groceryList"></ul>
</div>

</body>
</html>
<script src="assets/script.js"></script>
